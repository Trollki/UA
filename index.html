<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detective Transformer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #c8c8d0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.4;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.3em;
    color: #e8e0d0;
    text-shadow: 0 0 30px rgba(180,160,120,0.3);
    margin-bottom: 16px;
    animation: flicker 8s infinite;
  }

  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 1; }
    98% { opacity: 0.9; }
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 1;
  }

  .video-wrapper {
    position: relative;
    border: 1px solid #333340;
    box-shadow: 0 0 60px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.5);
  }

  canvas, video {
    display: block;
    width: 640px;
    height: 480px;
    object-fit: cover;
  }

  video { display: none; }

  /* Scanlines */
  .video-wrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
  }

  /* Corner brackets */
  .corner { position: absolute; width: 20px; height: 20px; border-color: #b8a878; border-style: solid; }
  .corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

  .hud {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: #b8a878;
    opacity: 0.8;
  }

  .fps {
    position: absolute;
    bottom: 12px; right: 14px;
    font-size: 0.6rem;
    color: #666;
  }

  .mode-label {
    position: absolute;
    bottom: 12px; left: 14px;
    font-size: 0.6rem;
    color: #b8a878;
    letter-spacing: 0.12em;
  }

  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  button {
    background: transparent;
    border: 1px solid #333340;
    color: #888;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  button:hover { border-color: #b8a878; color: #e8e0d0; }
  button.active { border-color: #b8a878; color: #b8a878; background: rgba(184,168,120,0.08); }

  .start-btn {
    background: rgba(184,168,120,0.1);
    border-color: #b8a878;
    color: #e8e0d0;
    padding: 10px 32px;
    font-size: 0.8rem;
  }

  .hint {
    font-size: 0.6rem;
    color: #444;
    letter-spacing: 0.08em;
    text-align: center;
  }

  #status {
    font-size: 0.65rem;
    color: #666;
    letter-spacing: 0.1em;
    min-height: 16px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>DETECTIVE TRANSFORMER</h1>

  <div id="status">— AWAITING CAMERA —</div>

  <div class="video-wrapper">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="hud" id="hud">◈ OFFLINE</div>
    <div class="fps" id="fps">-- FPS</div>
    <div class="mode-label" id="modeLabel">MODE: --</div>
  </div>

  <div class="controls">
    <button class="start-btn" onclick="startCamera()">▶ START CAMERA</button>
  </div>

  <div class="controls" id="modeButtons" style="display:none">
    <button onclick="setMode('raw')" id="btn-raw">RAW</button>
    <button onclick="setMode('detective')" id="btn-detective" class="active">DETECTIVE</button>
    <button onclick="setMode('smooth')" id="btn-smooth">SMOOTH</button>
    <button onclick="setMode('sharp')" id="btn-sharp">SHARP</button>
    <button onclick="setMode('noir')" id="btn-noir">NOIR B&W</button>
  </div>

  <div class="hint">Press button above to activate mode</div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const status = document.getElementById('status');
const hud = document.getElementById('hud');
const fpsEl = document.getElementById('fps');
const modeLabel = document.getElementById('modeLabel');

let mode = 'detective';
let running = false;
let lastTime = performance.now();
let frameCount = 0;
let fps = 0;

async function startCamera() {
  try {
    status.textContent = '— CONNECTING TO CAMERA —';
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    video.srcObject = stream;
    await new Promise(r => video.onloadedmetadata = r);
    video.play();
    running = true;
    hud.textContent = '◈ LIVE';
    status.textContent = '— ACTIVE —';
    document.getElementById('modeButtons').style.display = 'flex';
    requestAnimationFrame(processFrame);
  } catch(e) {
    status.textContent = '— CAMERA ERROR: ' + e.message + ' —';
  }
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('#modeButtons button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + m).classList.add('active');
}

function applyDetective(data) {
  const d = data.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i+1], b = d[i+2];

    // Cool blue-grey tint
    let nr = r * 0.88;
    let ng = g * 0.92;
    let nb = b * 1.05;

    // S-curve contrast
    nr = Math.pow(nr/255, 0.85) * 255 * 1.1;
    ng = Math.pow(ng/255, 0.85) * 255 * 1.1;
    nb = Math.pow(nb/255, 0.85) * 255 * 1.1;

    d[i]   = Math.min(255, nr);
    d[i+1] = Math.min(255, ng);
    d[i+2] = Math.min(255, nb);
  }
  return data;
}

function applyNoir(data) {
  const d = data.data;
  for (let i = 0; i < d.length; i += 4) {
    const gray = d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114;
    const contrast = Math.pow(gray/255, 0.8) * 255 * 1.15;
    const val = Math.min(255, contrast);
    d[i] = d[i+1] = d[i+2] = val;
  }
  return data;
}

function applySharp(data, w, h) {
  const src = new Uint8ClampedArray(data.data);
  const d = data.data;
  const kernel = [0, -0.5, 0, -0.5, 3, -0.5, 0, -0.5, 0];
  for (let y = 1; y < h-1; y++) {
    for (let x = 1; x < w-1; x++) {
      for (let c = 0; c < 3; c++) {
        let val = 0;
        for (let ky = -1; ky <= 1; ky++)
          for (let kx = -1; kx <= 1; kx++)
            val += src[((y+ky)*w+(x+kx))*4+c] * kernel[(ky+1)*3+(kx+1)];
        d[(y*w+x)*4+c] = Math.min(255, Math.max(0, val));
      }
    }
  }
  return data;
}

function applySmooth(data, w, h) {
  const src = new Uint8ClampedArray(data.data);
  const d = data.data;
  for (let y = 1; y < h-1; y++) {
    for (let x = 1; x < w-1; x++) {
      for (let c = 0; c < 3; c++) {
        let sum = 0;
        for (let ky = -1; ky <= 1; ky++)
          for (let kx = -1; kx <= 1; kx++)
            sum += src[((y+ky)*w+(x+kx))*4+c];
        d[(y*w+x)*4+c] = sum / 9;
      }
    }
  }
  return data;
}

function processFrame() {
  if (!running) return;

  ctx.drawImage(video, 0, 0, 640, 480);

  if (mode !== 'raw') {
    const imageData = ctx.getImageData(0, 0, 640, 480);

    if (mode === 'detective') applyDetective(imageData);
    else if (mode === 'noir') applyNoir(imageData);
    else if (mode === 'sharp') { applyDetective(imageData); applySharp(imageData, 640, 480); }
    else if (mode === 'smooth') applySmooth(imageData, 640, 480);

    ctx.putImageData(imageData, 0, 0);
  }

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastTime >= 1000) {
    fps = frameCount;
    frameCount = 0;
    lastTime = now;
    fpsEl.textContent = fps + ' FPS';
    modeLabel.textContent = 'MODE: ' + mode.toUpperCase();
  }

  requestAnimationFrame(processFrame);
}
</script>
</body>
</html>
